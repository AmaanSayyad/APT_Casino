<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="128" viewBox="0 0 512 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="128" rx="20" fill="#1E293B"/>
  
  <!-- Casino Chip and Icon on Left -->
  <g transform="translate(64, 64) scale(0.8)">
    <!-- Casino Chip Border -->
    <circle cx="0" cy="0" r="56" fill="#334155" stroke="#0EA5E9" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="8 4"/>
    
    <!-- Gems -->
    <path d="M-20 -25L-12 -10L-24 -5L-32 -20L-20 -25Z" fill="#60A5FA" stroke="#0EA5E9" stroke-width="1"/>
    <path d="M20 -20L28 -5L16 0L8 -15L20 -20Z" fill="#818CF8" stroke="#6366F1" stroke-width="1"/>
    <path d="M0 20L10 30L0 35L-10 30L0 20Z" fill="#34D399" stroke="#10B981" stroke-width="1"/>
    
    <!-- Mine -->
    <circle cx="0" cy="-5" r="10" fill="#475569"/>
    <circle cx="0" cy="-5" r="5" fill="#0F172A"/>
    
    <!-- Spikes -->
    <line x1="0" y1="-18" x2="0" y2="-15" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="0" y2="8" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-13" y1="-5" x2="-10" y2="-5" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="-5" x2="13" y2="-5" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-9" y1="-14" x2="-7" y2="-12" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="2" x2="9" y2="4" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-9" y1="4" x2="-7" y2="2" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="-12" x2="9" y2="-14" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="170" y="54" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#FFFFFF">APT CASINO</text>
  <text x="175" y="84" font-family="Arial, sans-serif" font-weight="normal" font-size="16" fill="#94A3B8">MINES GAME</text>
</svg> 